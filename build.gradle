plugins {
    id 'java'
    id 'application'
    id 'io.neow3j.gradle-plugin' version '3.21.2'
}

group 'network.bane'
version '1.0-SNAPSHOT'

sourceCompatibility = 1.8
targetCompatibility = 1.8

repositories {
    mavenCentral()
}

sourceSets {
    deploy {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    main {
        runtimeClasspath += sourceSets.deploy.runtimeClasspath
    }
}

dependencies {
    implementation 'io.neow3j:devpack:3.21.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.0',
            'io.neow3j:devpack-test:3.21.2',
            'ch.qos.logback:logback-classic:1.3.4'

    deployImplementation 'io.neow3j:compiler:3.21.2',
            'ch.qos.logback:logback-classic:1.2.11'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

neow3jCompiler {
    className = project.hasProperty('className') ? project.className : "network.bane.BridgeContract"
}

// The following configuration enables you to execute any specific
// class file that contains a main() method, directly in the command line.
// For example:
// ./gradlew -q -PmainClass=network.bane.Deployment run
application {
    mainClassName = project.hasProperty("mainClass") ? project.mainClass : "network.bane.Deployment"
}