plugins {
    id 'java'
    id 'application'
    id 'io.neow3j.gradle-plugin' version '3.23.0-SNAPSHOT'
}

group 'network.bane'
version '1.0-SNAPSHOT'

sourceCompatibility = 1.8
targetCompatibility = 1.8

repositories {
    mavenCentral()
    // TODO: Remove this repository once neow3j 3.23.0 is released.
    maven { url "https://oss.sonatype.org/content/repositories/snapshots" }
}

sourceSets {
    deploy {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    main {
        runtimeClasspath += sourceSets.deploy.runtimeClasspath
    }
}

dependencies {
    // TODO: Update the neow3j version once 3.23.0 is released.
    implementation 'io.neow3j:devpack:3.23.0-SNAPSHOT'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.0',
            'io.neow3j:devpack-test:3.23.0-SNAPSHOT',
            'ch.qos.logback:logback-classic:1.3.4'

    deployImplementation 'io.neow3j:compiler:3.23.0-SNAPSHOT',
            'io.neow3j:devpack:3.23.0-SNAPSHOT',
            'io.neow3j:contract:3.23.0-SNAPSHOT',
            'ch.qos.logback:logback-classic:1.2.11'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

neow3jCompiler {
    className = project.hasProperty('className') ? project.className : "network.bane.bridge.BridgeContract"
}

// The following configuration enables you to execute any specific
// class file that contains a main() method, directly in the command line.
// For example:
// ./gradlew -q -PmainClass=network.bane.Deployment run
tasks.named('run') {
    if (!project.hasProperty('mainClass')) {
        throw new GradleException('The "mainClass" property is not specified. Please provide it using -PmainClass=your.main.Class')
    } else {
        // If the property is provided, set it as the main class name to run
        project.mainClassName = project.mainClass
    }
}
