plugins {
    id 'java'
    id 'application'
    id 'io.neow3j.gradle-plugin' version '3.24.0'
}

group 'network.bane'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

/*
 * If Gradle is run with JDK 9+, this enforces Java 8 APIs and bytecode.
 * If Gradle is run with JDK 8, --release is not available, so source/target compatibility above applies.
 */
tasks.withType(JavaCompile).configureEach {
    if (JavaVersion.current().isJava9Compatible()) {
        options.release = 8
    }
}

sourceSets {
    /*
     * main = contract code only.
     *
     * Keep this as `main` because the neow3j Gradle plugin currently appears to compile from normal
     * compileJava/sourceSets.main output.
     */
    main {
        java {
            srcDirs = ['src/contracts/java']
        }
    }

    /*
     * Off-chain production client code:
     * DTOs, wrappers, contract clients, SDK-based helpers.
     */
    client {
        java {
            srcDirs = ['src/client/java']
        }
    }

    /*
     * Operational code:
     * deployment, initialization, state reads, tx sending, governor scripts.
     */
    ops {
        java {
            srcDirs = ['src/ops/java']
        }

        /*
         * Make the contract output and the custom client source set available to ops.
         *
         * Gradle only wires `main` and `test` automatically. Since `client` is a custom source set,
         * we explicitly add its compiled classes and runtime dependencies to the ops classpaths.
         *
         * In this project, `main` contains the contract classes. Ops needs those classes for compilation/deployment
         * workflows, while reusable off-chain client wrappers and DTOs come from the `client` source set.
         */
        compileClasspath += sourceSets.main.output + sourceSets.client.output + configurations.clientRuntimeClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.client.output + configurations.clientRuntimeClasspath
    }

    test {
        /*
         * Make the custom client source set available to tests.
         *
         * this lets tests reuse the production client wrappers and DTOs instead of duplicating SDK interaction logic
         *  in test code.
         */
        compileClasspath += sourceSets.client.output + configurations.clientRuntimeClasspath
        runtimeClasspath += sourceSets.client.output + configurations.clientRuntimeClasspath
    }
}

dependencies {
    /*
     * main/contracts dependencies.
     * Keep this as small as possible.
     */
    implementation 'io.neow3j:devpack:3.24.0'

    /*
     * client source set dependencies.
     * This is normal off-chain JVM code.
     */
    clientImplementation 'io.neow3j:contract:3.24.0'

    /*
     * tests
     */
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.0',
            'io.neow3j:devpack-test:3.24.0',
            'ch.qos.logback:logback-classic:1.3.4'

    /*
     * Make client output visible to tests as a dependency.
     */
    testImplementation sourceSets.client.output

    /*
     * ops source set dependencies.
     */
    opsImplementation sourceSets.main.output
    opsImplementation sourceSets.client.output

    opsImplementation 'io.neow3j:compiler:3.24.0',
            'io.neow3j:devpack:3.24.0',
            'io.neow3j:contract:3.24.0',
            'ch.qos.logback:logback-classic:1.3.4'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

neow3jCompiler {
    className = project.hasProperty('className') ? project.className : "network.bane.bridge.BridgeContract"
}

/*
 * Run an ops class:
 *
 * ./gradlew runOps -PmainClass=network.bane.ops.Deployment
 */
tasks.register('runOps', JavaExec) {
    group = 'application'
    description = 'Runs a class from the ops source set. Use -PmainClass=your.main.Class'
    classpath = sourceSets.ops.runtimeClasspath
    doFirst {
        if (!project.hasProperty('mainClass')) {
            throw new GradleException(
                    'The "mainClass" property is not specified. Please provide it using -PmainClass=your.main.Class'
            )
        }
        mainClass = project.property('mainClass').toString()
    }
}
